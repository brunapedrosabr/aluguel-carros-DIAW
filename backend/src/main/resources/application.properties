spring.application.name=aluguel-carros
server.port=${SERVER_PORT:8080}

# Lê variáveis de um arquivo backend/.env (opcional, não versionado). Veja .env.example.
spring.config.import=optional:file:.env[.properties]

# ------------------------------------------------------------------
# Banco de dados: Supabase (PostgreSQL)
# Use a connection string do "Session pooler" (Project Settings > Database > Connect).
# ------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

# As tabelas ficam num schema próprio (fora do "public", que a API REST do Supabase expõe).
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:aluguel}
spring.jpa.properties.jakarta.persistence.create-database-schemas=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# Autenticação (JWT) e CORS
# ------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio}
app.jwt.expiracao-horas=8
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Cria a cliente de demonstração (ana.ribeiro) na primeira execução.
app.seed.demo=${SEED_DEMO:true}
